[package]
name = "zz-deploy-desktop"
version = "0.1.1"
description = "至真部署 - ITSM 部署桌面客户端"
authors = ["zhizhen-devops"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zz_deploy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["cookies", "gzip", "brotli"] }
url = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "net"] }
aes-gcm = "0.10"
rand = "0.8"
tauri-plugin-store = "2"
# rustls-tls-native-roots 而非 native-tls：避免平台 OpenSSL 差异，三端行为一致
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
# 必须显式指定加密后端：tokio-tungstenite 的 rustls 特性没有带 provider，
# 缺它时首个 wss:// 连接会 panic（release 下 panic=abort → 应用闪退）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
